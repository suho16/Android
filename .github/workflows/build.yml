
name: Build Heart Rate APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract and build
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP 파일을 찾을 수 없습니다."
            ls -la
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          gradle -p extracted/HeartRateCamera assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeartRateCamera-APK
          path: extracted/HeartRateCamera/app/build/outputs/apk/debug/app-debug.apk
